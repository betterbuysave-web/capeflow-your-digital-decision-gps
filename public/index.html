<!doctype html>
<!--
  Web HTML template (used by `expo export -p web` and the dev server because
  web.output is 'single' — app/+html.tsx only applies to 'static' output).
  The lang attribute and title below are substituted from app.config.ts at
  build time; only their FIRST occurrence in this file is replaced, so don't
  repeat those placeholder tokens anywhere above them.

  Carries the PWA install contract: the manifest link for Android/Chrome and the
  apple-* tags iOS Safari needs (iOS ignores most of the manifest). Keep the app
  identity in public/manifest.json in sync with the name in app.config.ts.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Free youth decision app: Consent Café, Strongest Voice Script Lab, 3-Second Rule practice and a SafER Score. No sign-ups. Everything stays on your phone." />
    <link rel="canonical" href="https://theharnessproject.org/capeflow" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/betterbuysave-web/capeflow-your-digital-decision-gps/main/public/icons/favicon.png" />

    <!-- Link previews (Open Graph + Twitter). Keep in sync with the title and description. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The HARNESS Project" />
    <meta property="og:title" content="CAPE Flow: Your Digital Decision GPS | Youth Empowerment" />
    <meta property="og:description" content="Free youth decision app: Consent Café, Strongest Voice Script Lab, 3-Second Rule practice and a SafER Score. No sign-ups. Everything stays on your phone." />
    <meta property="og:url" content="https://theharnessproject.org/capeflow" />
    <meta property="og:image" content="https://raw.githubusercontent.com/betterbuysave-web/capeflow-your-digital-decision-gps/main/public/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CAPE Flow logo with the words: CAPE Flow. Free, no sign-ups, stays on your phone." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CAPE Flow: Your Digital Decision GPS | Youth Empowerment" />
    <meta name="twitter:description" content="Free youth decision app: Consent Café, Strongest Voice Script Lab, 3-Second Rule practice and a SafER Score. No sign-ups. Everything stays on your phone." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/betterbuysave-web/capeflow-your-digital-decision-gps/main/public/og-image.png" />

    <!-- Structured data: the app and The HARNESS Project. -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "EducationalOrganization",
      "@id": "https://theharnessproject.org/#org",
      "name": "The HARNESS Project LLC",
      "url": "https://theharnessproject.org/",
      "email": "email@theharnessproject.org",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Houston",
        "addressRegion": "TX",
        "addressCountry": "US"
      },
      "founder": {
        "@type": "Person",
        "name": "Christopher Zacharie"
      }
    },
    {
      "@type": "WebApplication",
      "name": "CAPE Flow",
      "url": "https://theharnessproject.org/capeflow",
      "description": "Free youth decision app: Consent Café, Strongest Voice Script Lab, 3-Second Rule practice and a SafER Score. No sign-ups. Everything stays on your phone.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "iOS, Android, Web",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "image": "https://raw.githubusercontent.com/betterbuysave-web/capeflow-your-digital-decision-gps/main/public/og-image.png",
      "publisher": {
        "@id": "https://theharnessproject.org/#org"
      },
      "audience": {
        "@type": "PeopleAudience",
        "suggestedMinAge": 11,
        "suggestedMaxAge": 18
      },
      "isPartOf": {
        "@type": "Course",
        "name": "CAPE Youth Edition"
      }
    }
  ]
}
    </script>

    <!-- Web app manifest — the install contract for Android/Chrome -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F6F1E3" />

    <!-- iOS home-screen support. No apple-mobile-web-app-title: iOS falls back to
         <title>, which is substituted from app.config.ts and stays in sync. -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/betterbuysave-web/capeflow-your-digital-decision-gps/main/public/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Web fonts load without blocking the first paint (moved from global.css @import). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" /><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" /></noscript>
    <!-- Boot splash: painted from the first HTML byte, before the JS bundle. Removed by lib/bootSplash.ts once the app has rendered. -->
    <style id="boot-splash-css">
      html,body{background:#F6F1E3;margin:0}
      #boot-splash{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:#F6F1E3;background-image:linear-gradient(#E2D9C3 1px,transparent 1px),linear-gradient(90deg,#E2D9C3 1px,transparent 1px);background-size:24px 24px;color:#16324F;font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .25s ease}
      #boot-splash.bs-out{opacity:0;pointer-events:none}
      #boot-splash .bs-card{width:100%;max-width:360px;text-align:center}
      #boot-splash img{width:96px;height:96px;margin:0 auto 14px;display:block}
      #boot-splash h1{margin:0;font:800 34px/1.05 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.01em}
      #boot-splash .bs-sub{margin:6px 0 18px;color:#4E5A66;font:600 13px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
      #boot-splash ul{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
      #boot-splash li{font:600 12px/1.2 ui-monospace,Menlo,Consolas,monospace;padding:7px 10px;border:1px solid #E2D9C3;background:#FFFDF7;border-radius:999px;color:#16324F}
      #boot-splash .bs-bar{height:4px;border-radius:2px;background:#E2D9C3;overflow:hidden;margin:0 auto 18px;max-width:220px}
      #boot-splash .bs-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#2A9D8F,#C29B38,#A6387E);animation:bs-slide 1.1s ease-in-out infinite}
      @keyframes bs-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#boot-splash .bs-bar i{animation:none;width:100%}#boot-splash{transition:none}}
      #boot-splash .bs-urgent{margin:0;font-size:14px;color:#4E5A66}
      #boot-splash .bs-urgent b{color:#A6387E}
      #boot-splash .bs-slow{margin:14px 0 0;font-size:13px;color:#4E5A66;opacity:0;animation:bs-show 0s 10s forwards}
      @keyframes bs-show{to{opacity:1}}
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      <main>
        <h1>CAPE Flow: moving from anxiety to agency</h1>
        <p>Free youth decision app: Consent Café, Strongest Voice Script Lab, 3-Second Rule practice and a SafER Score. No sign-ups. Everything stays on your phone.</p>
        <ul>
        <li>The Consent Café and the F.R.I.E.S. consent check</li>
        <li>Strongest Voice Script Lab: boundary scripts you practice out loud</li>
        <li>The 3-Second Rule Challenge for posting and sharing</li>
        <li>Midnight Sims: practice hard moments before they happen</li>
        <li>Safety Circle and a 24/7 Crisis Protocol</li>
        <li>Zero Stigma Tax: no accounts, no tracking, data stays on the device</li>
        </ul>
        <p>Turn on JavaScript to open the app.</p>
        <p>The HARNESS Project LLC | theharnessproject.org. For educational purposes only. Not medical advice. © 2026 Christopher Zacharie and The HARNESS Project LLC. All rights reserved.</p>
      </main>
    </noscript>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading CAPE Flow">
      <div class="bs-card">
        <img src="/icons/icon-192.png" width="96" height="96" alt="" />
        <h1>CAPE <span style="color:#2A9D8F">Flow</span></h1>
        <p class="bs-sub">Your Digital Decision GPS</p>
        <ul><li>Grades 6–12 · Green 6–8 · Blue 9–12</li><li>No account · stays on this device</li></ul>
        <div class="bs-bar" aria-hidden="true"><i></i></div>
        <p class="bs-urgent"><b>In danger right now?</b> Call 911. Need to talk? Call or text 988.</p>
        <p class="bs-slow">Still loading. Check your connection — your saved entries are safe on this device.</p>
      </div>
    </div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
