<!doctype html>
<!--
  Web HTML template (used by `expo export -p web` and the dev server because
  web.output is 'single' — app/+html.tsx only applies to 'static' output).
  The lang attribute and title below are substituted from app.config.ts at
  build time; only their FIRST occurrence in this file is replaced, so don't
  repeat those placeholder tokens anywhere above them.

  Carries the PWA install contract: the manifest link for Android/Chrome and the
  apple-* tags iOS Safari needs (iOS ignores most of the manifest). Keep the app
  identity in public/manifest.json in sync with the name in app.config.ts.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Free youth decision app: Consent Café, Strongest Voice Script Lab, 3-Second Rule practice and a SafER Score. No sign-ups. Everything stays on your phone." />
    <link rel="canonical" href="https://theharnessproject.org/capeflow" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />

    <!-- Link previews (Open Graph + Twitter). Keep in sync with the title and description. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The HARNESS Project" />
    <meta property="og:title" content="CAPE Flow: Your Digital Decision GPS | Youth Empowerment" />
    <meta property="og:description" content="Free youth decision app: Consent Café, Strongest Voice Script Lab, 3-Second Rule practice and a SafER Score. No sign-ups. Everything stays on your phone." />
    <meta property="og:url" content="https://theharnessproject.org/capeflow" />
    <meta property="og:image" content="https://raw.githubusercontent.com/betterbuysave-web/capeflow-your-digital-decision-gps/main/public/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CAPE Flow logo with the words: CAPE Flow. Free, no sign-ups, stays on your phone." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CAPE Flow: Your Digital Decision GPS | Youth Empowerment" />
    <meta name="twitter:description" content="Free youth decision app: Consent Café, Strongest Voice Script Lab, 3-Second Rule practice and a SafER Score. No sign-ups. Everything stays on your phone." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/betterbuysave-web/capeflow-your-digital-decision-gps/main/public/og-image.png" />

    <!-- Structured data: the app and The HARNESS Project. -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "EducationalOrganization",
      "@id": "https://theharnessproject.org/#org",
      "name": "The HARNESS Project LLC",
      "url": "https://theharnessproject.org/",
      "email": "email@theharnessproject.org",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Houston",
        "addressRegion": "TX",
        "addressCountry": "US"
      },
      "founder": {
        "@type": "Person",
        "name": "Christopher Zacharie"
      }
    },
    {
      "@type": "WebApplication",
      "name": "CAPE Flow",
      "url": "https://theharnessproject.org/capeflow",
      "description": "Free youth decision app: Consent Café, Strongest Voice Script Lab, 3-Second Rule practice and a SafER Score. No sign-ups. Everything stays on your phone.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "iOS, Android, Web",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "image": "https://raw.githubusercontent.com/betterbuysave-web/capeflow-your-digital-decision-gps/main/public/og-image.png",
      "publisher": {
        "@id": "https://theharnessproject.org/#org"
      },
      "audience": {
        "@type": "PeopleAudience",
        "suggestedMinAge": 11,
        "suggestedMaxAge": 18
      },
      "isPartOf": {
        "@type": "Course",
        "name": "CAPE Youth Edition"
      }
    }
  ]
}
    </script>

    <!-- Web app manifest — the install contract for Android/Chrome -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F6F1E3" />

    <!-- iOS home-screen support. No apple-mobile-web-app-title: iOS falls back to
         <title>, which is substituted from app.config.ts and stays in sync. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      <main>
        <h1>CAPE Flow: moving from anxiety to agency</h1>
        <p>Free youth decision app: Consent Café, Strongest Voice Script Lab, 3-Second Rule practice and a SafER Score. No sign-ups. Everything stays on your phone.</p>
        <ul>
        <li>The Consent Café and the F.R.I.E.S. consent check</li>
        <li>Strongest Voice Script Lab: boundary scripts you practise out loud</li>
        <li>The 3-Second Rule Challenge for posting and sharing</li>
        <li>Midnight Sims: practise hard moments before they happen</li>
        <li>Safety Circle and a 24/7 Crisis Protocol</li>
        <li>Zero Stigma Tax: no accounts, no tracking, data stays on the device</li>
        </ul>
        <p>Turn on JavaScript to open the app.</p>
        <p>The HARNESS Project LLC | theharnessproject.org. For educational purposes only. Not medical advice. © 2026 Christopher Zacharie and The HARNESS Project LLC. All rights reserved.</p>
      </main>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
